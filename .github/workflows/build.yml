name: Build apps

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  API_BASE_URL: http://8.133.195.35:40128

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: callyou-android
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release --dart-define=API_BASE_URL=$env:API_BASE_URL

      - name: Zip portable build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath callyou-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: callyou-windows
          path: frontend/callyou-windows.zip
